# Lailara LLC — Retailer Scorecard engagement config (DEMO)
# Canonical Cinderhaven identity; demo: true so the deploy guard ignores it.
# The deployed simulator renders committed frontend JSON — this config exercises
# client_mode.py on a demo-shaped cost-to-serve profile under client-data/ (gitignored).
client:
  name: "Cinderhaven Provisions (demo)"
engagement:
  id: "CINDERHAVEN-DEMO"
as_of_date: "2026-01-02"
prepared_by: "Lailara LLC"
demo: true
inputs:
  input: "client-data/retailers.csv"
columns:
  retailer_id: "retailer_id"
  name: "name"
  gross_revenue: "gross_revenue"
  cogs_rate: "cogs_rate"
  deductions_rate: "deductions_rate"
  trade_spend_rate: "trade_spend_rate"
  payment_terms_days: "payment_terms_days"
  cost_of_capital: "cost_of_capital"
  labor_hours_compliance: "labor_hours_compliance"
  labor_hours_disputes: "labor_hours_disputes"
  labor_rate: "labor_rate"
  returns_rate: "returns_rate"
  freight_differential_rate: "freight_differential_rate"
  pallet_surcharge_rate: "pallet_surcharge_rate"
  moq_penalty_rate: "moq_penalty_rate"
thresholds:
  fail_on_missing_required_column: true
  fail_on_duplicate_keys: true
